name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vercel already deploys master to production through its own Git
      # integration — that is what actually ships the app. The steps below are
      # for the Supabase side, and none of the secrets they need are set on
      # this repository, so they are gated rather than left to fail red on
      # every push. Set SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and
      # VERCEL_DEPLOY_HOOK_URL to switch them on.
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase deploy secrets are not set — skipping the Supabase steps. Vercel deploys the app independently."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.gate.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # DISABLED — `supabase db push` here would corrupt production.
      #
      # It matches local migration filename versions against
      # supabase_migrations.schema_migrations. Local files are numbered
      # 0000…0060; the database records timestamp versions (20260514202438…)
      # because every migration to date was applied through the dashboard or
      # MCP, not the CLI. The overlap is ZERO, so this step would treat all 64
      # local files as pending and replay them against a live database holding
      # 30 tenants — including 0048_drop_starter_schema.sql, which drops.
      #
      # supabase/migrations/ is also drizzle-kit's output directory, so it is
      # not a Supabase migrations directory in the first place. The verbatim
      # record of what has actually run is in supabase/applied-history/
      # (`npm run db:export-history`).
      #
      # Migrations are applied out-of-band today. Before re-enabling this,
      # reconcile the two: point drizzle's `out` elsewhere, seed
      # supabase/migrations/ from applied-history, and `supabase link` the
      # project so versions line up.
      #
      # - name: Apply database migrations
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #   run: |
      #     supabase db push \
      #       --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
      #       --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy Edge Functions
        if: steps.gate.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy subscription-transition \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      # Redundant while Vercel's Git integration is connected — it has already
      # started the production build by the time this runs. Kept, but only
      # fires if a hook URL is actually configured.
      - name: Trigger Vercel production deployment
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
