name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Migrate & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # DISABLED — `supabase db push` here would corrupt production.
      #
      # It matches local migration filename versions against
      # supabase_migrations.schema_migrations. Local files are numbered
      # 0000…0060; the database records timestamp versions (20260514202438…)
      # because every migration to date was applied through the dashboard or
      # MCP, not the CLI. The overlap is ZERO, so this step would treat all 64
      # local files as pending and replay them against a live database holding
      # 30 tenants — including 0048_drop_starter_schema.sql, which drops.
      #
      # supabase/migrations/ is also drizzle-kit's output directory, so it is
      # not a Supabase migrations directory in the first place. The verbatim
      # record of what has actually run is in supabase/applied-history/
      # (`npm run db:export-history`).
      #
      # Migrations are applied out-of-band today. Before re-enabling this,
      # reconcile the two: point drizzle's `out` elsewhere, seed
      # supabase/migrations/ from applied-history, and `supabase link` the
      # project so versions line up.
      #
      # - name: Apply database migrations
      #   env:
      #     SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      #   run: |
      #     supabase db push \
      #       --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
      #       --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy subscription-transition \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Trigger Vercel production deployment
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
